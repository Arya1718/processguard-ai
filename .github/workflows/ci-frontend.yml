name: CI — Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

env:
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend — lint, test, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit || true

      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run E2E tests (Playwright)
        working-directory: frontend
        run: npm run e2e

      - name: Dependency security scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=moderate || echo "::warning::npm audit found issues; review before merging"

      - name: Build production image
        working-directory: frontend
        run: |
          docker build -t processguard-frontend:ci .
          docker images processguard-frontend:ci --format "Built image: {{.Repository}}:{{.Tag}} Size={{.Size}}"
