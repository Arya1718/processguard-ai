# OpenTelemetry Collector configuration.
# Receives traces + metrics from both services and forwards to:
#   * Prometheus (metrics via remote_write)
#   * OTLP (traces stay in memory for the collector's own /metrics)
# Prompt 9: stand-in for Azure Monitor / Application Insights backend.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector-self"
          static_configs:
            - targets: ["0.0.0.0:8888"]

exporters:
  # Forward traces to console for local dev (replace with Azure Monitor
  # in staging/prod).
  debug:
    verbosity: basic
  # Forward metrics to Prometheus via remote_write.
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]
