# Prometheus configuration for ProcessGuard AI.
# Prompt 9: scrapes /metrics from both the .NET middleware and the Python
# agent-service, and pulls metrics from the OpenTelemetry collector itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "processguard-ai"

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # --- .NET middleware (prometheus-net via OpenTelemetry metrics) ---
  - job_name: "processguard-middleware"
    static_configs:
      - targets: ["middleware:8080"]
    metrics_path: "/metrics"

  # --- Python agent service (prometheus-client) ---
  - job_name: "processguard-agent-service"
    static_configs:
      - targets: ["agent-service:8000"]
    metrics_path: "/metrics"

  # --- OpenTelemetry collector self-metrics ---
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
