[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    integration: requires the live docker compose stack (deselect with -m 'not integration')
    contract: JSON schema contract tests (no live stack needed)
    unit: hermetic unit tests
    load: load/performance tests (run explicitly via scripts/run_load_tests.py, never in CI)
    regression: LLM behavioral regression set (needs GROQ_API_KEY; run explicitly)
    data: needs converted TEP data under data/tep/ (scripts/download_tep_data.py)

[coverage:run]
source = app
omit =
    app/main.py
    app/core/runtime.py
    app/agent_service/tests/*
    */__init__.py

[coverage:report]
# Prompt 10: 75% minimum coverage threshold on the agent service.
# Chosen because the codebase has substantial LLM-backed code (non-deterministic
# paths) and infrastructure glue code that's exercised via the integration
# suite (live stack) rather than unit tests. 75% is the floor that still forces
# new logic to be tested while not making integration-only modules block CI.
fail_under = 75
show_missing = true
