# Serves the built React app; /api/v1 is proxied to the middleware and
# /oidc/* to the local identity provider so the browser sees a single origin
# (no CORS configuration needed in dev). Runs as non-root
# (nginx-unprivileged), listening on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://middleware:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # Prompt 7: the OIDC provider (authorization + token + JWKS endpoints).
    # Same-origin proxying keeps the browser flow simple; the provider is NOT
    # otherwise reachable from the frontend network.
    location /oidc/ {
        proxy_pass http://oidc-provider:8090/;
        proxy_set_header Host $host;
    }

    location = /oidc {
        return 301 /oidc/;
    }

    location / {
        try_files $uri /index.html;
    }
}
